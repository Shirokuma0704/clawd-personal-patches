<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500"><title>킁킁 꽃 냄새</title><style>.body{transform-box:view-box;transform-origin:7.5px 15px;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:body 7s infinite cubic-bezier(.45,0,.55,1)}@keyframes body{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}20%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}32%{transform:translate(1px,-0.2px) rotate(7deg) scale(1,1)}40%{transform:translate(1.2px,0px) rotate(8deg) scale(1.03,0.97)}46%{transform:translate(1px,0px) rotate(7deg) scale(1,1)}52%{transform:translate(1.2px,0px) rotate(8deg) scale(1.03,0.97)}60%{transform:translate(0.5px,-1px) rotate(-3deg) scale(0.97,1.04);animation-timing-function:cubic-bezier(.22,1,.36,1)}74%{transform:translate(0px,-0.6px) rotate(-2deg) scale(1,1)}86%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.left{transform-box:fill-box;transform-origin:100% 50%;transform:translate(0,0) rotate(0deg) scale(1);animation:left 7s infinite ease-in-out}@keyframes left{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.right{transform-box:fill-box;transform-origin:0% 50%;transform:translate(0,0) rotate(0deg) scale(1);animation:right 7s infinite ease-in-out}@keyframes right{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.feet{transform-box:fill-box;transform-origin:50% 100%;transform:translate(0,0) rotate(0deg) scale(1);animation:feet 7s infinite ease-in-out}@keyframes feet{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.prop{transform-box:fill-box;transform-origin:50% 50%;animation:prop 7s infinite cubic-bezier(.45,0,.55,1)}@keyframes prop{0%,100%{opacity:1}}.flower{transform-box:fill-box;transform-origin:50% 100%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:flower 7s infinite cubic-bezier(.45,0,.55,1)}@keyframes flower{0%{transform:translate(0px,0px) rotate(0deg) scale(0.6,0)}8%{transform:translate(0px,0px) rotate(0deg) scale(0.6,0);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}20%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}34%{transform:translate(0px,0px) rotate(-6deg) scale(1,1)}48%{transform:translate(0px,0px) rotate(4deg) scale(1,1)}62%{transform:translate(0px,0px) rotate(-3deg) scale(1,1)}80%{transform:translate(0px,0px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.64,0,.78,0)}92%{transform:translate(0px,0px) rotate(0deg) scale(0.6,0)}100%{transform:translate(0px,0px) rotate(0deg) scale(0.6,0)}}.eyesN{transform-box:fill-box;transform-origin:50% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:eyesN 7s infinite cubic-bezier(.45,0,.55,1)}@keyframes eyesN{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}32%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}34%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}78%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}80%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}}.eyesH{transform-box:fill-box;transform-origin:50% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:eyesH 7s infinite cubic-bezier(.45,0,.55,1)}@keyframes eyesH{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}32%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}34%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}78%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}80%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}}.blush{transform-box:fill-box;transform-origin:50% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:blush 7s infinite cubic-bezier(.45,0,.55,1)}@keyframes blush{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0.65}56%{transform:translate(0px,0px) rotate(