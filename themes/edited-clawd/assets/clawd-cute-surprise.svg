<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500"><title>깜짝! 느낌표</title><style>.body{transform-box:view-box;transform-origin:7.5px 15px;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:body 3.2s infinite cubic-bezier(.45,0,.55,1)}@keyframes body{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}4%{transform:translate(0px,0px) rotate(0deg) scale(1.08,0.9);animation-timing-function:cubic-bezier(.22,1,.36,1)}12%{transform:translate(0px,-3.5px) rotate(0deg) scale(0.9,1.12);animation-timing-function:cubic-bezier(.64,0,.78,0)}22%{transform:translate(0px,0px) rotate(0deg) scale(1.1,0.88);animation-timing-function:cubic-bezier(.22,1,.36,1)}30%{transform:translate(0px,-0.4px) rotate(0deg) scale(1,1)}36%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}42%{transform:translate(0.4px,0px) rotate(0deg) scale(1,1)}46%{transform:translate(-0.4px,0px) rotate(0deg) scale(1,1)}50%{transform:translate(0.4px,0px) rotate(0deg) scale(1,1)}54%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}66%{transform:translate(0px,-0.4px) rotate(-3deg) scale(1,1)}78%{transform:translate(0px,0px) rotate(2deg) scale(1,1)}90%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.left{transform-box:fill-box;transform-origin:100% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:left 3.2s infinite cubic-bezier(.45,0,.55,1)}@keyframes left{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}4%{transform:translate(0px,0px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.22,1,.36,1)}12%{transform:translate(0px,0px) rotate(130deg) scale(1,1)}26%{transform:translate(0px,0px) rotate(110deg) scale(1,1)}40%{transform:translate(0px,0px) rotate(40deg) scale(1,1)}56%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.right{transform-box:fill-box;transform-origin:0% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:right 3.2s infinite cubic-bezier(.45,0,.55,1)}@keyframes right{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}4%{transform:translate(0px,0px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.22,1,.36,1)}12%{transform:translate(0px,0px) rotate(-130deg) scale(1,1)}26%{transform:translate(0px,0px) rotate(-110deg) scale(1,1)}40%{transform:translate(0px,0px) rotate(-40deg) scale(1,1)}56%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.feet{transform-box:fill-box;transform-origin:50% 100%;transform:translate(0,0) rotate(0deg) scale(1);animation:feet 3.2s infinite ease-in-out}@keyframes feet{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.prop{transform-box:fill-box;transform-origin:50% 50%;animation:prop 3.2s infinite cubic-bezier(.45,0,.55,1)}@keyframes prop{0%{transform:translate(7px,3px) rotate(0deg) scale(0.3,0.3);opacity:0}8%{transform:translate(7px,3px) rotate(0deg) scale(0.3,0.3);opacity:0;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}16%{transform:translate(7px,-1.5px) rotate(0deg) scale(1.3,1.3);opacity:1}24%{transform:translate(7px,-0.4px) rotate(0deg) scale(1,1)}46%{transform:translate(7px,-0.7px) rotate(0deg) scale(1,1);opacity:1;animation-timing-function:cubic-bezier(.64,0,.78,0)}56%{transform:translate(7px,-2px) rotate(0deg) scale(0.7,0.7);opacity:0}100%{transform:translate(7px,-2px) rotate(0deg) scale(0.7,0.7);opacity:0}}.eyesW{transform-box:fill-box;transform-origin:50% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:eyesW 3.2s infinite cubic-bezier(.45,0,.55,1)}@keyframes eyesW{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}54%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}56%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}}.eyesH{transform-box:fill-box;transform-origin:50% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:eyesH 3.2s infinite cubic-bezier(.45,0,.55,1)}@keyframes eyesH{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}54%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}56%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}}.blush{transform-box:fill-box;transform-origin:50% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:blush 3.2s infinite cubic-bezier(.45,0,.55,1)}@keyframes blush{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0.65}58%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0.65}66%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}84%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}94%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0.65}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0.65}}</style><rect x="3" y="15" width="9" height="1" fill="#514454"/><g id="accessory-anchor" class="body"><g fill="#DE886D"><g class="feet"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7"/><g class="left"><rect x="0" y="9" width="2" height="2"/></g><g class="right"><rect x="13" y="9" width="2" height="2"/></g></g><g class="eyesW"><rect x="3.5" y="7.5" width="2" height="2" fill="#211F29"/><rect x="9.5" y="7.5" width="2" height="2" fill="#211F29"/></g><g class="eyesH"><path d="M4 8l2 1l-2 1M11 8l-2 1l2 1" fill="none" stroke="#211F29" stroke-width="0.7"/><g class="blush" opacity=".65"><rect x="4" y="11" width="1" height="1" fill="#F28E9F"/><rect x="10" y="11" width="1" height="1" fill="#F28E9F"/></g></g><g class="blush" opacity=".65"><rect x="3" y="11" width="1" height="1" fill="#F28E9F"/><rect x="11" y="11" width="1" height="1" fill="#F28E9F