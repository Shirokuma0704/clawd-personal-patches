<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500"><title>편지 왔어요</title><style>.body{transform-box:view-box;transform-origin:7.5px 15px;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:body 5s infinite cubic-bezier(.45,0,.55,1)}@keyframes body{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}10%{transform:translate(0px,-1px) rotate(0deg) scale(0.97,1.03);animation-timing-function:cubic-bezier(.64,0,.78,0)}16%{transform:translate(0px,0px) rotate(0deg) scale(1.04,0.96);animation-timing-function:cubic-bezier(.22,1,.36,1)}28%{transform:translate(0px,0px) rotate(4deg) scale(1,1)}42%{transform:translate(0px,0px) rotate(-4deg) scale(1,1)}56%{transform:translate(0px,0px) rotate(3.5deg) scale(1,1)}70%{transform:translate(0px,0px) rotate(-3.5deg) scale(1,1)}80%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}88%{transform:translate(0px,-0.6px) rotate(0deg) scale(1,1)}94%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.left{transform-box:fill-box;transform-origin:100% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:left 5s infinite cubic-bezier(.45,0,.55,1)}@keyframes left{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}12%{transform:translate(3px,1px) rotate(0deg) scale(1,1)}40%{transform:translate(3px,0.6px) rotate(0deg) scale(1,1)}60%{transform:translate(3px,1px) rotate(0deg) scale(1,1)}84%{transform:translate(3px,1px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.64,0,.78,0)}94%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.right{transform-box:fill-box;transform-origin:0% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:right 5s infinite cubic-bezier(.45,0,.55,1)}@keyframes right{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}12%{transform:translate(-3px,1px) rotate(0deg) scale(1,1)}40%{transform:translate(-3px,0.6px) rotate(0deg) scale(1,1)}60%{transform:translate(-3px,1px) rotate(0deg) scale(1,1)}84%{transform:translate(-3px,1px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.64,0,.78,0)}94%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.feet{transform-box:fill-box;transform-origin:50% 100%;transform:translate(0,0) rotate(0deg) scale(1);animation:feet 5s infinite ease-in-out}@keyframes feet{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.prop{transform-box:fill-box;transform-origin:50% 50%;animation:prop 5s infinite cubic-bezier(.45,0,.55,1)}@keyframes prop{0%,100%{opacity:1}}</style><rect x="3" y="15" width="9" height="1" fill="#514454"/><g id="accessory-anchor" class="body"><g fill="#DE886D"><g class="feet"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7"/><g class="left"><rect x="0" y="9" width="2" height="2"/></g><g class="right"><rect x="13" y="9" width="2" height="2"/></g></g><path d="M4 9.5l1-1.5l1 1.5M9 9.5l1-1.5l1 1.5" fill="none" stroke="#211F29" stroke-width="0.7"/><g class="blush" opacity=".65"><rect x="3" y="11" width="1" height="1" fill="#F28E9F"/><rect x="11" y="11" width="1" height="1" fill="#F28E9F"/></g></g><g><rect x="4" y="11" width="7" height="4" fill="#FFF0D8"/><path d="M4 11l3.5 2L11 11" fill="none" stroke="#D59887" stroke-width=".5"/></g></svg>