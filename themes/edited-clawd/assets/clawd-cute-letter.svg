<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500"><title>편지 왔어요</title><style>.body{transform-box:fill-box;transform-origin:50% 100%;animation:body 5s infinite ease-in-out}@keyframes body{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}20%,60%{transform:rotate(4deg)}40%,80%{transform:rotate(-4deg)}}.left{transform-box:fill-box;transform-origin:100% 50%;animation:left 5s infinite ease-in-out}@keyframes left{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}15%,85%{transform:translate(3px,1px)}}.right{transform-box:fill-box;transform-origin:0% 50%;animation:right 5s infinite ease-in-out}@keyframes right{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}15%,85%{transform:translate(-3px,1px)}}.feet{transform-box:fill-box;transform-origin:50% 100%;animation:feet 5s infinite ease-in-out}@keyframes feet{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.prop{animation:prop 5s infinite ease-in-out}@keyframes prop{0%,100%{opacity:1}}</style><rect x="3" y="15" width="9" height="1" fill="#514454"/><g id="accessory-anchor" class="body"><g fill="#DE886D"><g class="feet"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7"/><g class="left"><rect x="0" y="9" width="2" height="2"/></g><g class="right"><rect x="13" y="9" width="2" height="2"/></g></g><path d="M4 9v-1h2v1M9 9v-1h2v1" fill="none" stroke="#211F29" stroke-width="0.7"/><g opacity=".65"><rect x="3" y="11" width="1" height="1" fill="#F28E9F"/><rect x="11" y="11" width="1" height="1" fill="#F28E9F"/></g></g><g><rect x="4" y="11" width="7" height="4" fill="#FFF0D8"/><path d="M4 11l3.5 2L11 11" fill="none" stroke="#D59887" stroke-width=".5"/></g></svg>
