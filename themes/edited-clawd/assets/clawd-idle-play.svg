<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .play-body {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: play-body 8s infinite ease-in-out;
      }
      .play-arm-left {
        transform-box: fill-box;
        transform-origin: 100% 50%;
        animation: play-arm-left 8s infinite ease-in-out;
      }
      .play-arm-right {
        transform-box: fill-box;
        transform-origin: 0% 50%;
        animation: play-arm-right 8s infinite ease-in-out;
      }
      .play-eyes {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: play-eyes 8s infinite step-end;
      }
      .play-shadow {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: play-shadow 8s infinite ease-in-out;
      }

      @keyframes play-body {
        0%, 10%, 90%, 100% { transform: translate(0, 0) rotate(0deg); }
        18% { transform: translate(-2px, 0) rotate(-3deg); }
        28% { transform: translate(2px, -1px) rotate(3deg); }
        38% { transform: translate(-2px, 0) rotate(-3deg); }
        48% { transform: translate(2px, -1px) rotate(3deg); }
        58% { transform: translate(-1px, 0) rotate(-2deg); }
        68% { transform: translate(1px, -1px) rotate(2deg); }
        78% { transform: translate(0, 1px) scale(1.05, 0.92); }
        84% { transform: translate(0, -1px) scale(0.98, 1.04); }
      }
      @keyframes play-arm-left {
        0%, 10%, 90%, 100% { transform: rotate(0deg); }
        18%, 38%, 58% { transform: rotate(45deg); }
        28%, 48%, 68% { transform: rotate(10deg); }
        78%, 84% { transform: rotate(28deg); }
      }
      @keyframes play-arm-right {
        0%, 10%, 90%, 100% { transform: rotate(0deg); }
        18%, 38%, 58% { transform: rotate(-10deg); }
        28%, 48%, 68% { transform: rotate(-45deg); }
        78%, 84% { transform: rotate(-28deg); }
      }
      @keyframes play-eyes {
        0%, 14%, 18%, 42%, 46%, 72%, 76%, 90%, 94%, 100% { transform: scaleY(1); }
        16%, 44%, 74%, 92% { transform: scaleY(0.15); }
      }
      @keyframes play-shadow {
        0%, 10%, 90%, 100% { transform: translateX(0) scaleX(1); opacity: 0.5; }
        18%, 38%, 58% { transform: translateX(-2px) scaleX(0.96); opacity: 0.48; }
        28%, 48%, 68% { transform: translateX(2px) scaleX(0.92); opacity: 0.44; }
        78% { transform: scaleX(1.08); opacity: 0.56; }
        84% { transform: scaleX(0.90); opacity: 0.4; }
      }
    </style>
  </defs>

  <rect class="play-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <g id="accessory-anchor" class="play-body">
    <g fill="#DE886D">
      <rect x="3" y="13" width="1" height="2"/>
      <rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/>
      <rect x="11" y="13" width="1" height="2"/>
      <rect x="2" y="6" width="11" height="7"/>
      <g class="play-arm-left">
        <rect x="0" y="9" width="2" height="2"/>
      </g>
      <g class="play-arm-right">
        <rect x="13" y="9" width="2" height="2"/>
      </g>
    </g>

    <g class="play-eyes" fill="#000000">
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="10" y="8" width="1" height="2"/>
    </g>
  </g>
</svg>
