<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .pet-body {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: pet-body 3.2s 1 ease-in-out forwards;
      }
      .pet-arm-left {
        transform-box: fill-box;
        transform-origin: 100% 50%;
        animation: pet-arm-left 3.2s 1 ease-in-out forwards;
      }
      .pet-arm-right {
        transform-box: fill-box;
        transform-origin: 0% 50%;
        animation: pet-arm-right 3.2s 1 ease-in-out forwards;
      }
      .pet-blush {
        opacity: 0;
        animation: pet-blush 3.2s 1 step-end forwards;
      }
      .pet-shadow {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: pet-shadow 3.2s 1 ease-in-out forwards;
      }

      @keyframes pet-body {
        0%, 8%, 100% { transform: translate(0, 0) scale(1, 1); }
        18% { transform: translate(0, 1px) scale(1.08, 0.90); }
        30% { transform: translate(-1px, 0) rotate(-3deg) scale(1.03, 0.97); }
        44% { transform: translate(1px, 0) rotate(3deg) scale(1.03, 0.97); }
        58% { transform: translate(-1px, 0) rotate(-2deg) scale(1.03, 0.97); }
        72% { transform: translate(0, -1px) scale(0.98, 1.04); }
        84% { transform: translate(0, 0) scale(1.02, 0.98); }
      }
      @keyframes pet-arm-left {
        0%, 12%, 88%, 100% { transform: rotate(0deg); }
        24%, 48%, 72% { transform: rotate(28deg); }
        36%, 60% { transform: rotate(12deg); }
      }
      @keyframes pet-arm-right {
        0%, 12%, 88%, 100% { transform: rotate(0deg); }
        24%, 48%, 72% { transform: rotate(-28deg); }
        36%, 60% { transform: rotate(-12deg); }
      }
      @keyframes pet-blush {
        0%, 15%, 86%, 100% { opacity: 0; }
        16%, 85% { opacity: 0.9; }
      }
      @keyframes pet-shadow {
        0%, 8%, 100% { transform: scaleX(1); opacity: 0.5; }
        18% { transform: scaleX(1.12); opacity: 0.58; }
        30%, 58% { transform: translateX(-1px) scaleX(1.04); opacity: 0.5; }
        44% { transform: translateX(1px) scaleX(1.04); opacity: 0.5; }
        72% { transform: scaleX(0.92); opacity: 0.42; }
      }
    </style>
  </defs>

  <rect class="pet-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <g id="accessory-anchor" class="pet-body">
    <g fill="#DE886D">
      <rect x="3" y="13" width="1" height="2"/>
      <rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/>
      <rect x="11" y="13" width="1" height="2"/>
      <rect x="2" y="6" width="11" height="7"/>
      <g class="pet-arm-left">
        <rect x="0" y="9" width="2" height="2"/>
      </g>
      <g class="pet-arm-right">
        <rect x="13" y="9" width="2" height="2"/>
      </g>
    </g>

    <g fill="none" stroke="#000000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4,8 5.5,9 4,10"/>
      <polyline points="11,8 9.5,9 11,10"/>
    </g>

    <g class="pet-blush" fill="#F05E78">
      <rect x="3" y="11" width="1" height="1"/>
      <rect x="11" y="11" width="1" height="1"/>
    </g>
  </g>
</svg>
