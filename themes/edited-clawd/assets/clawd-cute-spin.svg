le(1,1)}60%{transform:translate(0px,0px) rotate(-100deg) scale(1,1)}80%{transform:translate(0px,0px) rotate(-100deg) scale(1,1);animation-timing-function:cubic-bezier(.64,0,.78,0)}90%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.feet{transform-box:fill-box;transform-origin:50% 100%;transform:translate(0,0) rotate(0deg) scale(1);animation:feet 4s infinite ease-in-out}@keyframes feet{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.prop{transform-box:fill-box;transform-origin:50% 50%;animation:prop 4s infinite cubic-bezier(.45,0,.55,1)}@keyframes prop{0%,100%{opacity:1}}</style><rect x="3" y="15" width="9" height="1" fill="#514454"/><g id="accessory-anchor" class="body"><g fill="#DE886D"><g class="feet"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7"/><g class="left"><rect x="0" y="9" width="2" height="2"/></g><g class="right"><rect x="13" y="9" width="2" height="2"/></g></g><path d="M4 8l2 1l-2 1M11 8l-2 1l2 1" fill="none" stroke="#211F29" stroke-width="0.7"/><g class="blush" opacity=".65"><rect x="3" y="11" width="1" height="1" fill="#F28E9F"/><rect x="11" y="11" width="1" height="1" fill="#F28E9F"/></g></g></svg>