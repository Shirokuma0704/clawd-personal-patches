<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500"><title>여기요! 손 흔들기</title><style>.body{transform-box:view-box;transform-origin:7.5px 15px;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:body 4s infinite cubic-bezier(.45,0,.55,1)}@keyframes body{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}10%{transform:translate(0px,0px) rotate(0deg) scale(1.04,0.96);animation-timing-function:cubic-bezier(.22,1,.36,1)}20%{transform:translate(0px,-1.2px) rotate(-3deg) scale(1,1)}30%{transform:translate(0px,-0.6px) rotate(-1deg) scale(1,1)}40%{transform:translate(0px,-1px) rotate(-3deg) scale(1,1)}50%{transform:translate(0px,-0.6px) rotate(-1deg) scale(1,1)}60%{transform:translate(0px,-1px) rotate(-3deg) scale(1,1)}70%{transform:translate(0px,-0.5px) rotate(0deg) scale(1,1)}84%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.left{transform-box:fill-box;transform-origin:100% 50%;transform:translate(0,0) rotate(0deg) scale(1);animation:left 4s infinite ease-in-out}@keyframes left{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.right{transform-box:fill-box;transform-origin:0% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:right 4s infinite cubic-bezier(.45,0,.55,1)}@keyframes right{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}10%{transform:translate(0px,0px) rotate(10deg) scale(1,1);animation-timing-function:cubic-bezier(.22,1,.36,1)}20%{transform:translate(0px,0px) rotate(-115deg) scale(1,1)}30%{transform:translate(0px,0px) rotate(-75deg) scale(1,1)}40%{transform:translate(0px,0px) rotate(-115deg) scale(1,1)}50%{transform:translate(0px,0px) rotate(-75deg) scale(1,1)}60%{transform:translate(0px,0px) rotate(-115deg) scale(1,1)}70%{transform:translate(0px,0px) rotate(-75deg) scale(1,1)}80%{transform:translate(0px,0px) rotate(-100deg) scale(1,1);animation-timing-function:cubic-bezier(.64,0,.78,0)}92%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.feet{transform-box:fill-box;transform-origin:50% 100%;transform:translate(0,0) rotate(0deg) scale(1);animation:feet 4s infinite ease-in-out}@keyframes feet{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.prop{transform-box:fill-box;transform-origin:50% 50%;animation:prop 4s infinite cubic-bezier(.45,0,.55,1)}@keyframes prop{0%{transform:translate(7px,3px) rotate(0deg) scale(0.3,0.3);opacity:0}14%{transform:translate(7px,3px) rotate(0deg) scale(0.3,0.3);opacity:0;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}22%{transform:translate(7px,1px) rotate(0deg) scale(1.1,1.1);opacity:1}30%{transform:translate(7px,1.4px) rotate(0deg) scale(1,1)}40%{transform:translate(7px,1px) rotate(0deg) scale(1.05,1.05)}50%{transform:translate(7px,1.4px) rotate(0deg) scale(1,1)}74%{transform:translate(7px,1.2px) rotate(0deg) scale(1,1);opacity:1;animation-timing-function:cubic-bezier(.64,0,.78,0)}86%{transform:translate(7px,0px) rotate(0deg) scale(0.8,0.8);opacity:0}100%{transform:translate(7px,0px) rotate(0deg) scale(0.8,0.8);opacity:0}}</style><rect x="3" y="15" width="9" height="1" fill="#514454"/><g id="accessory-anchor" class="body"><g fill="#DE886D"><g class="feet"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7"/><g class="left"><rect x="0" y="9" width="2" height="2"/></g><g class="right"><rect x="13" y="9" width="2" height="2"/></g></g><rect x="4" y="8" width="1" height="2" fill="#211F29"/><rect x="10" y="8" width="1" height="2" fill="#211F29"/><g class="blush" opacity=".65"><rect x="3" y="11" width="1" height="1" fill="#F28E9F"/><rect x="11" y="11" width="1" height="1" fill="#F28E9F"/></g></g><g class="prop"><rect x="0" y="-3" width="1" height="3" fill="#F47799"/><rect x="0" y="1" width="1" height="1" fill="#F47799"/