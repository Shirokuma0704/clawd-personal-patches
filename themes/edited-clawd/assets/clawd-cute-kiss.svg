<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500"><title>쪽! 하트 보내기</title><style>.body{transform-box:view-box;transform-origin:7.5px 15px;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:body 3.2s infinite cubic-bezier(.45,0,.55,1)}@keyframes body{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}18%{transform:translate(0px,0px) rotate(2deg) scale(1.03,0.97);animation-timing-function:cubic-bezier(.22,1,.36,1)}32%{transform:translate(0px,-1px) rotate(-5deg) scale(1,1)}55%{transform:translate(0px,-0.6px) rotate(-4deg) scale(1,1)}72%{transform:translate(0px,0px) rotate(1deg) scale(1,1)}86%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.left{transform-box:fill-box;transform-origin:100% 50%;transform:translate(0,0) rotate(0deg) scale(1);animation:left 3.2s infinite ease-in-out}@keyframes left{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.right{transform-box:fill-box;transform-origin:0% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:right 3.2s infinite cubic-bezier(.45,0,.55,1)}@keyframes right{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}18%{transform:translate(0px,0px) rotate(15deg) scale(1,1);animation-timing-function:cubic-bezier(.22,1,.36,1)}30%{transform:translate(-2.5px,-1.5px) rotate(-40deg) scale(1,1)}42%{transform:translate(-2.5px,-1.5px) rotate(-40deg) scale(1,1);animation-timing-function:cubic-bezier(.22,1,.36,1)}52%{transform:translate(0px,0px) rotate(-60deg) scale(1,1)}72%{transform:translate(0px,0px) rotate(-20deg) scale(1,1)}88%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.feet{transform-box:fill-box;transform-origin:50% 100%;transform:translate(0,0) rotate(0deg) scale(1);animation:feet 3.2s infinite ease-in-out}@keyframes feet{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.prop{transform-box:fill-box;transform-origin:50% 50%;animation:prop 3.2s infinite cubic-bezier(.45,0,.55,1)}@keyframes prop{0%{transform:translate(12px,7px) rotate(0deg) scale(0.4,0.4);opacity:0}46%{transform:translate(12px,7px) rotate(0deg) scale(0.4,0.4);opacity:0;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}56%{transform:translate(15px,5px) rotate(0deg) scale(1.15,1.15);opacity:1}68%{transform:translate(17px,3px) rotate(-8deg) scale(1,1)}82%{transform:translate(19px,0px) rotate(8deg) scale(1.2,1.2);opacity:0.9;animation-timing-function:cubic-bezier(.64,0,.78,0)}94%{transform:translate(20px,-2px) rotate(0deg) scale(1.35,1.35);opacity:0}100%{transform:translate(20px,-2px) rotate(0deg) scale(1.35,1.35);opacity:0}}</style><rect x="3" y="15" width="9" height="1" fill="#514454"/><g id="accessory-anchor" class="body"><g fill="#DE886D"><g class="feet"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7"/><g class="left"><rect x="0" y="9" width="2" height="2"/></g><g class="right"><rect x="13" y="9" width="2" height="2"/></g></g><path d="M4 9v-1h2v1M9 9v-1h2v1" fill="none" stroke="#211F29" stroke-width="0.7"/><g class="blush" opacity=".65"><rect x="3" y="11" width="1" height="1" fill="#F28E9F"/><rect x="11" y="11" width="1" height="1" fill="#F28E9F"/></g></g><g class="prop"><path d="M-2 0h2v1h1V0h2v2H2v1H1v1H0V3h-1V2h-1Z" fill="#F47799"/></g></svg>