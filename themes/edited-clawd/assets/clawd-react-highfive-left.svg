<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .five-body { transform-box: fill-box; transform-origin: 50% 100%; animation: five-body 2.6s 1 ease-in-out forwards; }
      .five-claw { transform-box: fill-box; transform-origin: 100% 100%; animation: five-claw 2.6s 1 ease-in-out forwards; }
      .five-shadow { transform-box: fill-box; transform-origin: 50% 50%; animation: five-shadow 2.6s 1 ease-in-out forwards; }
      @keyframes five-body { 0%, 8%, 92%, 100% { transform: none; } 20%, 72% { transform: translate(-1px, 0) rotate(-3deg); } 36% { transform: translate(-2px, -1px) rotate(-5deg); } 52% { transform: translate(-1px, 0) rotate(-2deg); } 82% { transform: translateY(1px) scale(1.04, 0.94); } }
      @keyframes five-claw { 0%, 10%, 88%, 100% { transform: rotate(0deg) translate(0, 0); } 24%, 38%, 52%, 66% { transform: rotate(22deg) translate(-1px, -3px); } 31%, 45%, 59% { transform: rotate(38deg) translate(-1px, -4px); } }
      @keyframes five-shadow { 0%, 100% { transform: scaleX(1); } 24%, 72% { transform: translateX(-1px) scaleX(1.06); } }
    </style>
  </defs>
  <rect class="five-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>
  <g id="accessory-anchor" class="five-body">
    <g fill="#DE886D">
      <rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/>
      <rect x="2" y="6" width="11" height="7"/>
      <g class="five-claw"><rect x="0" y="8" width="2" height="3"/></g><rect x="13" y="9" width="2" height="2"/>
    </g>
    <g fill="none" stroke="#000000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4,8 5.5,9 4,10"/><polyline points="11,8 9.5,9 11,10"/>
    </g>
  </g>
</svg>
