<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500"><title>콩콩 열일 타자</title><style>.body{transform-box:fill-box;transform-origin:50% 100%;transform:translate(0,0) rotate(0deg) scale(1);animation:body 1.2s infinite ease-in-out}@keyframes body{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}25%,75%{transform:translateY(-.4px)}50%{transform:translate(0,0) rotate(0deg) scale(1)}}.left{transform-box:fill-box;transform-origin:100% 50%;transform:translate(3px,3px);animation:left 1.2s infinite ease-in-out}@keyframes left{0%,100%{transform:translate(3px,3px)}25%,75%{transform:translate(3px,4px)}50%{transform:translate(3px,3px)}}.right{transform-box:fill-box;transform-origin:0% 50%;transform:translate(-3px,4px);animation:right 1.2s infinite ease-in-out}@keyframes right{0%,100%{transform:translate(-3px,4px)}25%,75%{transform:translate(-3px,3px)}50%{transform:translate(-3px,4px)}}.feet{transform-box:fill-box;transform-origin:50% 100%;transform:translate(0,0) rotate(0deg) scale(1);animation:feet 1.2s infinite ease-in-out}@keyframes feet{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.prop{animation:prop 1.2s infinite ease-in-out}@keyframes prop{0%,100%{opacity:1}}</style><rect x="3" y="15" width="9" height="1" fill="#514454"/><g id="accessory-anchor" class="body"><g fill="#DE886D"><g class="feet"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7"/><g class="left"><rect x="0" y="9" width="2" height="2"/></g><g class="right"><rect x="13" y="9" width="2" height="2"/></g></g><rect x="4" y="8" width="1" height="2" fill="#211F29"/><rect x="10" y="8" width="1" height="2" fill="#211F29"/><g opacity=".65"><rect x="3" y="11" width="1" height="1" fill="#F28E9F"/><rect x="11" y="11" width="1" height="1" fill="#F28E9F"/></g></g><g><rect x="2" y="14" width="11" height="2" fill="#C3BBCF"/><rect x="3" y="14" width="9" height="0.5" fill="#EEE8F4"/></g></svg>
