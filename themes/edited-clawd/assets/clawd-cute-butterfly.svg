<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500"><title>나비 친구</title><style>.body{transform-box:view-box;transform-origin:7.5px 15px;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:body 8s infinite cubic-bezier(.45,0,.55,1)}@keyframes body{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}15%{transform:translate(-0.5px,0px) rotate(-3deg) scale(1,1)}30%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}42%{transform:translate(0.5px,0px) rotate(3deg) scale(1,1)}55%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}60%{transform:translate(0px,0px) rotate(0deg) scale(1.03,0.97);animation-timing-function:cubic-bezier(.22,1,.36,1)}66%{transform:translate(0px,-0.2px) rotate(0deg) scale(1,1)}80%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}88%{transform:translate(0.5px,-0.5px) rotate(3deg) scale(1,1)}96%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.left{transform-box:fill-box;transform-origin:100% 50%;transform:translate(0,0) rotate(0deg) scale(1);animation:left 8s infinite ease-in-out}@keyframes left{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.right{transform-box:fill-box;transform-origin:0% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:right 8s infinite cubic-bezier(.45,0,.55,1)}@keyframes right{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}80%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}88%{transform:translate(0px,0px) rotate(-40deg) scale(1,1)}96%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.feet{transform-box:fill-box;transform-origin:50% 100%;transform:translate(0,0) rotate(0deg) scale(1);animation:feet 8s infinite ease-in-out}@keyframes feet{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.prop{transform-box:fill-box;transform-origin:50% 50%;animation:prop 8s infinite cubic-bezier(.45,0,.55,1)}@keyframes prop{0%,100%{opacity:1}}.bfly{transform-box:fill-box;transform-origin:50% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:bfly 8s infinite cubic-bezier(.45,0,.55,1)}@keyframes bfly{0%{transform:translate(-6px,-3px) rotate(0deg) scale(1,1);opacity:0}6%{transform:translate(-4px,-2px) rotate(0deg) scale(1,1);opacity:1}18%{transform:translate(0px,1px) rotate(0deg) scale(1,1)}30%{transform:translate(6px,-2px) rotate(0deg) scale(1,1)}42%{transform:translate(14px,0px) rotate(0deg) scale(1,1)}52%{transform:translate(11px,2px) rotate(0deg) scale(1,1)}60%{transform:translate(7px,4.5px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.22,1,.36,1)}82%{transform:translate(7px,4.5px) rotate(0deg) scale(1,1)}92%{transform:translate(13px,-3px) rotate(0deg) scale(1,1)}100%{transform:translate(18px,-7px) rotate(0deg) scale(1,1);opacity:0}}.flap{transform-box:fill-box;transform-origin:50% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:flap 0.36s infinite cubic-bezier(.45,0,.55,1)}@keyframes flap{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}50%{transform:translate(0px,0px) rotate(0deg) scale(0.3,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.eyesN{transform-box:fill-box;transform-origin:50% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:eyesN 8s infinite cubic-bezier(.45,0,.55,1)}@keyframes eyesN{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}60%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}62%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}82%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}84%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}}.eyesH{transform-box:fill-box;transform-origin:50% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:eyesH 8s infinite cubic-bezier(.45,0,.55,1)}@keyframes eyesH{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}60%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}62%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}82%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}84%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:0}}</style><rect x="3" y="15" width="9" height="1" fill="#514454"/><g id="accessory-anchor" class="body"><g fill="#DE886D"><g class="feet"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7"/><g class="left"><rect x="0" y="9" width="2" height="2"/></g><g class="right"><rect x="13" y="9" width="2" height="2"/></g></g><g class="eyesN"><rect x="4" y="8" width="1" height="2" fill="#211F29"/><rect x="10" y="8" width="1" height="2" fill="#211F29"/></g><g class="eyesH"><path d="M4 8l2 1l-2 1M11 8l-2 1l2 1" fill="none" stroke="#211F29" stroke-width="0.7"/></g><g class="blush" opacity=".65"><rect x="3" y="11" width="1" height="1" fill="#F28E9F"/><rect x="11" y="11" width="1" height="1" fill="#F28E9F"/></g></g><g class="bfly"><g class="flap"><rect x="-2" y="-1" width="2" height="2" fill="#F4A5C4"/><rect x="1" y="-1" width="2" height="2" fill="#F4A5C4"/><rect x="0" y="-1" width="1" height="3" fill="#514454"/></g></g></svg>