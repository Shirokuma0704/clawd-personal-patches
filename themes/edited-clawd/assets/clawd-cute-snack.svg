<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500"><title>쿠키 냠냠</title><style>.body{transform-box:view-box;transform-origin:7.5px 15px;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:body 8s infinite cubic-bezier(.45,0,.55,1)}@keyframes body{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}24%{transform:translate(0px,0px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.64,0,.78,0)}28%{transform:translate(0px,0px) rotate(2deg) scale(1.05,0.94);animation-timing-function:cubic-bezier(.22,1,.36,1)}34%{transform:translate(0px,-0.3px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.64,0,.78,0)}40%{transform:translate(0px,0px) rotate(2deg) scale(1.05,0.94);animation-timing-function:cubic-bezier(.22,1,.36,1)}46%{transform:translate(0px,-0.3px) rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.64,0,.78,0)}52%{transform:translate(0px,0px) rotate(2deg) scale(1.05,0.94);animation-timing-function:cubic-bezier(.22,1,.36,1)}58%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}72%{transform:translate(0px,-1px) rotate(0deg) scale(0.97,1.04)}80%{transform:translate(0px,0px) rotate(0deg) scale(1.03,0.97)}88%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.left{transform-box:fill-box;transform-origin:100% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:left 8s infinite cubic-bezier(.45,0,.55,1)}@keyframes left{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}12%{transform:translate(0px,0px) rotate(30deg) scale(1,1);animation-timing-function:cubic-bezier(.22,1,.36,1)}80%{transform:translate(0px,0px) rotate(30deg) scale(1,1)}88%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.right{transform-box:fill-box;transform-origin:0% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:right 8s infinite cubic-bezier(.45,0,