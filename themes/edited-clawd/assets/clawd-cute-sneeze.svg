<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500"><title>에취! 별가루</title><style>.body{transform-box:view-box;transform-origin:7.5px 15px;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:body 5s infinite cubic-bezier(.45,0,.55,1)}@keyframes body{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}12%{transform:translate(0px,-0.3px) rotate(-3deg) scale(1,1)}20%{transform:translate(0px,0px) rotate(-1deg) scale(1,1)}30%{transform:translate(0px,-1px) rotate(-7deg) scale(0.97,1.04);animation-timing-function:cubic-bezier(.64,0,.78,0)}36%{transform:translate(0px,0px) rotate(5deg) scale(1.12,0.84);animation-timing-function:cubic-bezier(.22,1,.36,1)}46%{transform:translate(0px,-1.2px) rotate(-2deg) scale(0.96,1.05)}58%{transform:translate(0px,0px) rotate(1.5deg) scale(1,1)}70%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.left{transform-box:fill-box;transform-origin:100% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:left 5s infinite cubic-bezier(.45,0,.55,1)}@keyframes left{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}30%{transform:translate(0px,0px) rotate(25deg) scale(1,1);animation-timing-function:cubic-bezier(.64,0,.78,0)}36%{transform:translate(0px,0px) rotate(60deg) scale(1,1);animation-timing-function:cubic-bezier(.22,1,.36,1)}50%{transform:translate(0px,0px) rotate(10deg) scale(1,1)}62%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}.right{transform-box:fill-box;transform-origin:0% 50%;transform:translate(0px,0px) rotate(0deg) scale(1,1);animation:right 5s infinite cubic-bezier(.45,0,.55,1)}@keyframes right{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}30%{transform:translate(0px,0px) rotate(-25deg) scale(1,1);animation-timing-function:cubic-bezier(.64,0,.78,0)}36%{transform:translate(0px,0px) rotate(-60deg) scale(1,1);animation-timing-functi