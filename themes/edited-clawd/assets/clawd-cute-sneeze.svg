<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500"><title>에취! 별가루</title><style>.body{transform-box:fill-box;transform-origin:50% 100%;animation:body 5s infinite ease-in-out}@keyframes body{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}25%{transform:rotate(-7deg) translateY(-1px)}40%{transform:translateY(2px) scale(1.12,.8)}48%{transform:translateY(-2px)}}.left{transform-box:fill-box;transform-origin:100% 50%;animation:left 5s infinite ease-in-out}@keyframes left{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}40%,50%{transform:rotate(50deg)}}.right{transform-box:fill-box;transform-origin:0% 50%;animation:right 5s infinite ease-in-out}@keyframes right{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}40%,50%{transform:rotate(-50deg)}}.feet{transform-box:fill-box;transform-origin:50% 100%;animation:feet 5s infinite ease-in-out}@keyframes feet{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}}.prop{animation:prop 5s infinite ease-in-out}@keyframes prop{0%,30%,70%,100%{opacity:0}40%{opacity:1;transform:translate(14px,7px)}65%{opacity:0;transform:translate(19px,4px)}}</style><rect x="3" y="15" width="9" height="1" fill="#514454"/><g id="accessory-anchor" class="body"><g fill="#DE886D"><g class="feet"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7"/><g class="left"><rect x="0" y="9" width="2" height="2"/></g><g class="right"><rect x="13" y="9" width="2" height="2"/></g></g><rect x="4" y="9" width="2" height="0.6" fill="#211F29"/><rect x="9" y="9" width="2" height="0.6" fill="#211F29"/><g opacity=".65"><rect x="3" y="11" width="1" height="1" fill="#F28E9F"/><rect x="11" y="11" width="1" height="1" fill="#F28E9F"/></g></g><g class="prop" transform="translate(16 7)"><path d="M0-2h1v2h2v1H1v2H0V1h-2V0h2Z" fill="#FFD77A"/></g></svg>
